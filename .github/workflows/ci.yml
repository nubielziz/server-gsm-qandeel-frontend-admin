# Continuous integration: the console's own checks on every push to main and on every pull request.
# No job reads a secret, so a pull request from a fork runs the same jobs. The production server deploys a commit of main only
# after this workflow succeeded for it (backend repository: deploy/cd/auto-deploy.sh, docs/OPERATIONS.md section 8).
# Actions are pinned to a commit; the comment names the release that commit is.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install the dependencies
        run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Lint, format and English only
        run: npm run lint
      - name: Tests
        run: npm test
      # The bundle the server builds: no mock layer, the API on the page's own origin.
      - name: Build
        run: npm run build
        env:
          VITE_API_MOCKS: 'false'
          VITE_API_BASE_URL: ''
