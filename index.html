<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="GSM Supply admin console" />
    <title>GSM Supply · Admin</title>
    <!-- Apply the saved theme and density before first paint (same keys as the demo) to avoid a flash. -->
    <script>
      try {
        var t = localStorage.getItem('gsm-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
        if (localStorage.getItem('gsm-dense') === '1') document.documentElement.classList.add('dense');
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>This console needs JavaScript.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
